name: adl_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Core data stack
  - numpy<2
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn

  # Data formats
  - pyarrow
  - h5py

  # Utils
  - tqdm

  # Jupyter
  - jupyter
  - ipykernel

  # PyTorch + CUDA 11.8 (versions appariées)
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=11.8

  # Pip
  - pip
  - pip:
      - timm
      - transformers
      - huggingface_hub
