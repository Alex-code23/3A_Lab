[project]
name = "lab-8"
version = "0.1.0"
description = "Sampling in Deep Learning Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "marimo",
    "matplotlib",
    "scikit-learn",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sampling_lab"]
