[project]
name = "lab-7"
version = "0.1.0"
description = "Knowledge Distillation Lab - When Knowledge Distillation Fails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "marimo",
    "medmnist",
    "safetensors",
    "matplotlib",
    "scikit-learn",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill_lab"]
