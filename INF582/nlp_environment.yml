name: nlp_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy<2.0
  - pandas
  - scipy
  - matplotlib

  # NLP / ML
  - nltk
  - scikit-learn
  - lxml
  - sentencepiece

  # PyTorch + CUDA 11.8
  - pytorch
  - pytorch-cuda=11.8
  - torchvision
  - torchaudio

  # Jupyter
  - jupyter
  - ipykernel

  # Optional but useful
  - tqdm
  - seaborn

  - pip :
    - huggingface-hub
    - transformers>=4.30.0,<5.0.0
    - tokenizers
    - datasets
